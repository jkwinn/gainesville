---
- name: Deploy Gainesville site and calendar sync
  hosts: gainesville_hosts
  become: true

  vars:
    gainesville_user: gainesville
    gainesville_group: gainesville
    gainesville_repo_url: https://github.com/jkwinn/gainesville.git
    gainesville_repo_version: main
    gainesville_app_dir: /opt/gainesville
    gainesville_web_root: /var/www/gainesville
    gainesville_config_dir: /etc/gainesville
    gainesville_server_name: _

    gainesville_calendar_id: gainesvilletheband@gmail.com
    gainesville_event_prefix: "Gig:"
    gainesville_timezone: America/Los_Angeles
    gainesville_calendar_lookback_days: 365
    gainesville_calendar_lookahead_days: 730
    gainesville_calendar_sync_interval: 15min
    gainesville_run_calendar_sync_now: true

    google_service_account_key_dest: "{{ gainesville_config_dir }}/google-calendar-service-account.json"
    gainesville_calendar_output_json: "{{ gainesville_web_root }}/data/shows.json"
    gainesville_calendar_image_dir: "{{ gainesville_web_root }}/assets/calendar"
    gainesville_calendar_image_public_prefix: assets/calendar

    gainesville_enable_firewall: true
    gainesville_enable_fail2ban: true
    gainesville_enable_unattended_upgrades: true
    gainesville_enable_sysctl_hardening: true
    gainesville_harden_ssh: false
    gainesville_enable_hsts: false
    gainesville_allowed_ssh_profile: OpenSSH
    gainesville_allowed_web_profile: Nginx Full
    gainesville_ssh_authorized_user: "{{ ansible_user | default(ansible_user_id) }}"
    gainesville_ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMCrTt0antmSMSolGkl020p/2o4rOxwuSR39KUsAMVaG jwinn@localfedora.com"

  pre_tasks:
    - name: Validate service account key source if provided
      ansible.builtin.stat:
        path: "{{ google_service_account_key_src }}"
      delegate_to: localhost
      become: false
      register: google_key_source
      failed_when: not google_key_source.stat.exists
      when: google_service_account_key_src is defined

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - fail2ban
          - git
          - nginx
          - python3
          - python3-pip
          - python3-venv
          - rsync
          - ufw
          - unattended-upgrades
        state: present
        update_cache: true

    - name: Enable unattended security updates
      ansible.builtin.copy:
        src: files/20auto-upgrades
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
      when: gainesville_enable_unattended_upgrades | bool

    - name: Configure unattended security updates
      ansible.builtin.copy:
        src: files/50unattended-upgrades
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        owner: root
        group: root
        mode: "0644"
      when: gainesville_enable_unattended_upgrades | bool

    - name: Install network hardening sysctl settings
      ansible.builtin.copy:
        src: files/99-gainesville-hardening.conf
        dest: /etc/sysctl.d/99-gainesville-hardening.conf
        owner: root
        group: root
        mode: "0644"
      when: gainesville_enable_sysctl_hardening | bool
      notify:
        - Apply sysctl settings

    - name: Install fail2ban ssh jail
      ansible.builtin.copy:
        src: files/fail2ban-sshd.local
        dest: /etc/fail2ban/jail.d/gainesville-sshd.local
        owner: root
        group: root
        mode: "0644"
      when: gainesville_enable_fail2ban | bool
      notify:
        - Restart fail2ban

    - name: Enable fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started
      when: gainesville_enable_fail2ban | bool

    - name: Look up SSH authorized key user
      ansible.builtin.getent:
        database: passwd
        key: "{{ gainesville_ssh_authorized_user }}"
      when: gainesville_ssh_authorized_keys | length > 0

    - name: Ensure SSH directory exists for authorized key user
      ansible.builtin.file:
        path: "{{ ansible_facts.getent_passwd[gainesville_ssh_authorized_user][4] }}/.ssh"
        state: directory
        owner: "{{ gainesville_ssh_authorized_user }}"
        mode: "0700"
      when: gainesville_ssh_authorized_keys | length > 0

    - name: Add managed SSH public keys
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts.getent_passwd[gainesville_ssh_authorized_user][4] }}/.ssh/authorized_keys"
        line: "{{ item }}"
        create: true
        owner: "{{ gainesville_ssh_authorized_user }}"
        mode: "0600"
      loop: "{{ gainesville_ssh_authorized_keys }}"
      when: gainesville_ssh_authorized_keys | length > 0

    - name: Create Gainesville group
      ansible.builtin.group:
        name: "{{ gainesville_group }}"
        system: true

    - name: Create Gainesville service user
      ansible.builtin.user:
        name: "{{ gainesville_user }}"
        group: "{{ gainesville_group }}"
        home: "{{ gainesville_app_dir }}"
        create_home: false
        shell: /usr/sbin/nologin
        system: true

    - name: Install optional SSH hardening
      ansible.builtin.template:
        src: templates/99-gainesville-sshd-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/99-gainesville-hardening.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      when: gainesville_harden_ssh | bool
      notify:
        - Restart ssh

    - name: Remove optional SSH hardening when disabled
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/99-gainesville-hardening.conf
        state: absent
      when: not gainesville_harden_ssh | bool
      notify:
        - Restart ssh

    - name: Create application, web, and config directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ gainesville_app_dir }}"
          owner: "{{ gainesville_user }}"
          group: "{{ gainesville_group }}"
          mode: "0755"
        - path: "{{ gainesville_web_root }}"
          owner: "{{ gainesville_user }}"
          group: "{{ gainesville_group }}"
          mode: "0755"
        - path: "{{ gainesville_web_root }}/data"
          owner: "{{ gainesville_user }}"
          group: "{{ gainesville_group }}"
          mode: "0755"
        - path: "{{ gainesville_calendar_image_dir }}"
          owner: "{{ gainesville_user }}"
          group: "{{ gainesville_group }}"
          mode: "0755"
        - path: "{{ gainesville_config_dir }}"
          owner: root
          group: "{{ gainesville_group }}"
          mode: "0750"

    - name: Clone or update Gainesville repo
      ansible.builtin.git:
        repo: "{{ gainesville_repo_url }}"
        dest: "{{ gainesville_app_dir }}"
        version: "{{ gainesville_repo_version }}"
        update: true
      become_user: "{{ gainesville_user }}"
      notify:
        - Restart calendar sync timer

    - name: Publish static site
      ansible.builtin.command:
        argv:
          - rsync
          - -a
          - --delete
          - --itemize-changes
          - --exclude=.git
          - --exclude=.github
          - --exclude=docs
          - --exclude=infra
          - --exclude=services
          - "{{ gainesville_app_dir }}/"
          - "{{ gainesville_web_root }}/"
      register: publish_static_site
      changed_when: publish_static_site.stdout != ""

    - name: Install nginx Gainesville site
      ansible.builtin.template:
        src: templates/nginx-gainesville.conf.j2
        dest: /etc/nginx/sites-available/gainesville
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload nginx

    - name: Enable nginx Gainesville site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/gainesville
        dest: /etc/nginx/sites-enabled/gainesville
        state: link
        owner: root
        group: root
      notify:
        - Reload nginx

    - name: Disable nginx default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify:
        - Reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Enable nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: Allow SSH through UFW before enabling firewall
      ansible.builtin.command:
        argv:
          - ufw
          - allow
          - "{{ gainesville_allowed_ssh_profile }}"
      register: ufw_allow_ssh
      changed_when: "'Skipping adding existing rule' not in ufw_allow_ssh.stdout"
      when: gainesville_enable_firewall | bool

    - name: Allow web traffic through UFW
      ansible.builtin.command:
        argv:
          - ufw
          - allow
          - "{{ gainesville_allowed_web_profile }}"
      register: ufw_allow_web
      changed_when: "'Skipping adding existing rule' not in ufw_allow_web.stdout"
      when: gainesville_enable_firewall | bool

    - name: Set UFW default incoming policy
      ansible.builtin.command:
        argv:
          - ufw
          - default
          - deny
          - incoming
      changed_when: false
      when: gainesville_enable_firewall | bool

    - name: Set UFW default outgoing policy
      ansible.builtin.command:
        argv:
          - ufw
          - default
          - allow
          - outgoing
      changed_when: false
      when: gainesville_enable_firewall | bool

    - name: Enable UFW
      ansible.builtin.command:
        argv:
          - ufw
          - --force
          - enable
      register: ufw_enable
      changed_when: "'Firewall is active and enabled on system startup' in ufw_enable.stdout"
      when: gainesville_enable_firewall | bool

    - name: Copy Google service account key when provided
      ansible.builtin.copy:
        src: "{{ google_service_account_key_src }}"
        dest: "{{ google_service_account_key_dest }}"
        owner: root
        group: "{{ gainesville_group }}"
        mode: "0640"
      when: google_service_account_key_src is defined
      no_log: true
      notify:
        - Run calendar sync now

    - name: Check service account key on server
      ansible.builtin.stat:
        path: "{{ google_service_account_key_dest }}"
      register: google_key_dest

    - name: Fail if service account key is not available
      ansible.builtin.fail:
        msg: >-
          Google service account key was not found at {{ google_service_account_key_dest }}.
          Pass -e google_service_account_key_src=/path/to/key.json on the first run,
          or place the key on the server before running this playbook.
      when: not google_key_dest.stat.exists

    - name: Install calendar sync Python dependencies
      ansible.builtin.pip:
        requirements: "{{ gainesville_app_dir }}/services/calendar-sync/requirements.txt"
        virtualenv: "{{ gainesville_app_dir }}/services/calendar-sync/.venv"
        virtualenv_command: python3 -m venv
      become_user: "{{ gainesville_user }}"
      notify:
        - Run calendar sync now

    - name: Install calendar sync environment
      ansible.builtin.template:
        src: templates/gainesville-calendar-sync.env.j2
        dest: "{{ gainesville_config_dir }}/calendar-sync.env"
        owner: root
        group: "{{ gainesville_group }}"
        mode: "0640"
      notify:
        - Run calendar sync now

    - name: Install calendar sync service
      ansible.builtin.template:
        src: templates/gainesville-calendar-sync.service.j2
        dest: /etc/systemd/system/gainesville-calendar-sync.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Run calendar sync now

    - name: Install calendar sync timer
      ansible.builtin.template:
        src: templates/gainesville-calendar-sync.timer.j2
        dest: /etc/systemd/system/gainesville-calendar-sync.timer
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart calendar sync timer

    - name: Flush handlers before enabling timer
      ansible.builtin.meta: flush_handlers

    - name: Enable calendar sync timer
      ansible.builtin.systemd:
        name: gainesville-calendar-sync.timer
        enabled: true
        state: started

  handlers:
    - name: Apply sysctl settings
      ansible.builtin.command:
        argv:
          - sysctl
          - --system
      changed_when: true

    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: restarted

    - name: Restart ssh
      ansible.builtin.systemd:
        name: ssh
        state: restarted

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: reloaded

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart calendar sync timer
      ansible.builtin.systemd:
        name: gainesville-calendar-sync.timer
        state: restarted
        enabled: true

    - name: Run calendar sync now
      ansible.builtin.systemd:
        name: gainesville-calendar-sync.service
        state: started
      when: gainesville_run_calendar_sync_now | bool
